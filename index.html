    APP.spawnAsset = async function spawnAsset(queryName, opts = {}) {
      const key = String(queryName || '').replace(/\.[^.]+$/, '').toLowerCase().trim();
      const findIn = (map) => map.get(key) || Array.from(map.values()).find(r => r.cleanName.includes(key));

      let glbRec = findIn(APP.importedGLBs);
      let imgRec = findIn(APP.importedImages);
      let vidRec = findIn(APP.importedVideos);

      if (!glbRec && !imgRec && !vidRec && key) {
        const probeExts = [
          { path: `./assets/${key}.glb`, type: 'glb' },
          { path: `./assets/${key}.gltf`, type: 'glb' },
          { path: `./${key}.glb`, type: 'glb' },
          { path: `./assets/${key}.png`, type: 'img' },
          { path: `./assets/${key}.jpg`, type: 'img' },
          { path: `./assets/${key}.mp4`, type: 'vid' }
        ];
        for (const c of probeExts) {
          try {
            const head = await fetch(c.path, { method: 'HEAD' });
            if (head.ok) {
              const rec = { name: c.path.split('/').pop(), cleanName: key, url: c.path, ext: c.type };
              if (c.type === 'glb') glbRec = rec;
              else if (c.type === 'img') imgRec = rec;
              else vidRec = rec;
              break;
            }
          } catch (_) {}
        }
      }

      const spawnPos = opts.position || APP.getSpawnPosition(1.15, true);

      if (glbRec) {
        return new Promise((resolve) => {
          APP.ui.setStatus(`Loading ${glbRec.name}...`, 'busy');
          gltfLoader.load(glbRec.url, (gltf) => {
            const group = new THREE.Group();
            const model = gltf.scene;
            group.add(model);

            group.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const scale = (opts.targetSize || 0.52) / maxDim;
            model.scale.multiplyScalar(scale);

            group.updateMatrixWorld(true);
            const box2 = new THREE.Box3().setFromObject(model);
            model.position.y -= box2.min.y;
            const center = new THREE.Vector3();
            box2.getCenter(center);
            model.position.x -= center.x;
            model.position.z -= center.z;

            group.position.copy(spawnPos);
            const ent = APP.registerEntity(group, {
              name: glbRec.cleanName, category: 'asset_glb', physics: { gravity: !!opts.gravity }
            });
            if (APP.visual?.applyDissolveShader) APP.visual.applyDissolveShader(group, 'materialize');
            else if (typeof APP.materializeObject === 'function') APP.materializeObject(group);
            APP.emit('entity:created', ent);
            if (APP.bot?.onEntityCreated) APP.bot.onEntityCreated(ent);
            APP.ui.setStatus('Ready', 'ok');
            resolve({ ok: true, entity: ent });
          }, undefined, (err) => {
            APP.ui.setStatus('Asset load error', 'err');
            resolve({ ok: false, error: `Failed to load ${glbRec.name}: ${err.message}` });
          });
        });
      }

      if (imgRec) {
        const tex = await new THREE.TextureLoader().loadAsync(imgRec.url);
        tex.colorSpace = THREE.SRGBColorSpace;
        const aspect = (tex.image?.width || 1) / (tex.image?.height || 1);
        const h = 0.55, w = h * aspect;
        const group = new THREE.Group();
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true })
        );
        mesh.position.y = h * 0.5 + 0.15;
        group.add(mesh);
        group.position.copy(spawnPos);
        const ent = APP.registerEntity(group, { name: imgRec.cleanName, category: 'asset_image' });
        if (APP.visual?.applyDissolveShader) APP.visual.applyDissolveShader(group, 'materialize');
        APP.emit('entity:created', ent);
        return { ok: true, entity: ent };
      }

      if (vidRec) {
        const video = document.createElement('video');
        video.src = vidRec.url; video.crossOrigin = 'anonymous'; video.loop = true; video.muted = false; video.playsInline = true;
        await video.play().catch(() => { video.muted = true; return video.play().catch(() => {}); });
        const tex = new THREE.VideoTexture(video);
        tex.colorSpace = THREE.SRGBColorSpace;
        const group = new THREE.Group();
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.45), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
        mesh.position.y = 0.45;
        group.add(mesh);
        group.position.copy(spawnPos);
        const ent = APP.registerEntity(group, { name: vidRec.cleanName, category: 'asset_video' });
        if (APP.visual?.applyDissolveShader) APP.visual.applyDissolveShader(group, 'materialize');
        APP.emit('entity:created', ent);
        return { ok: true, entity: ent };
      }

      return { ok: false, error: `Asset "${queryName}" not found in repo /assets/ or local imports.` };
    };
    APP.spawnAssetByName = APP.spawnAsset;

    // =========================================================================
    // 10. VOICE COMMAND PIPELINE (Web Speech API + Groq Whisper + Noise Gate)
    // =========================================================================
    const HALLUCINATIONS = [
      'gracias', 'subtitulos', 'subtítulos', 'thank you for watching',
      'thanks for watching', 'subscribe', 'amara.org', 'mbc', 'you', '.'
    ];
    function isPhantomTranscript(text) {
      const t = APP.normalizeText(text);
      if (!t || t.length < 2) return true;
      return HALLUCINATIONS.some(h => t === APP.normalizeText(h));
    }

    let recognition = null, whisperRecorder = null, whisperStream = null;

    APP.speakTTS = function speakTTS(text) {
      if (!text || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = /[\u0600-\u06FF]/.test(text) ? 'ar-SA' : (APP.lang || 'en-US');
        u.rate = 1.03;
        APP.isSpeakingTTS = true; APP.ttsSpeaking = true;
        u.onend = () => { setTimeout(() => { APP.isSpeakingTTS = false; APP.ttsSpeaking = false; }, 350); };
        u.onerror = () => { APP.isSpeakingTTS = false; APP.ttsSpeaking = false; };
        window.speechSynthesis.speak(u);
      } catch (_) { APP.isSpeakingTTS = false; APP.ttsSpeaking = false; }
    };

    APP.toggleMic = async function toggleMic(forceState) {
      const target = typeof forceState === 'boolean' ? forceState : !APP.micActive;
      APP.micActive = target;
      syncCoreHUD();
      APP.emit('mic:changed', APP.micActive);
      if (APP.toolbar?.syncState) APP.toolbar.syncState();

      if (APP.ai?.isLiveModelSelected?.() && APP.bot?.setLiveMic) {
        await APP.bot.setLiveMic(APP.micActive);
        return APP.micActive;
      }

      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (APP.micActive) {
        if (SpeechRec) {
          recognition = new SpeechRec();
          recognition.lang = APP.lang || 'en-US';
          recognition.continuous = true;
          recognition.interimResults = false;
          recognition.onresult = (ev) => {
            if (APP.isSpeakingTTS || APP.botSpeaking) return;
            const res = ev.results[ev.results.length - 1];
            if (!res.isFinal) return;
            const transcript = res[0].transcript.trim();
            if (!isPhantomTranscript(transcript)) APP.executeCommand(transcript, 'voice');
          };
          recognition.onerror = (e) => {
            if (e.error === 'not-allowed') {
              APP.ui.toast('Microphone permission denied.');
              APP.micActive = false; syncCoreHUD(); APP.emit('mic:changed', false);
            }
          };
          recognition.onend = () => { if (APP.micActive) { try { recognition.start(); } catch (_) {} } };
          try { recognition.start(); APP.ui.toast(`Mic ON (${APP.lang})`); }
          catch (e) { APP.ui.toast(`Mic error: ${e.message}`); }
        } else if (APP.ai?.keys?.groq) {
          await startGroqWhisperLoop();
        } else {
          APP.micActive = false; syncCoreHUD(); APP.emit('mic:changed', false);
          APP.ui.toast('SpeechRecognition unavailable; enter a Groq key for Whisper fallback.');
        }
      } else {
        if (recognition) { try { recognition.stop(); } catch (_) {} recognition = null; }
        if (whisperRecorder && whisperRecorder.state !== 'inactive') whisperRecorder.stop();
        if (whisperStream) { whisperStream.getTracks().forEach(t => t.stop()); whisperStream = null; }
        APP.ui.toast('Mic OFF');
      }
      if (APP.toolbar?.syncState) APP.toolbar.syncState();
      return APP.micActive;
    };

    async function startGroqWhisperLoop() {
      try {
        whisperStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaStreamSource(whisperStream);
        const analyser = ctx.createAnalyser(); analyser.fftSize = 512; src.connect(analyser);
        const buf = new Float32Array(analyser.fftSize);

        const recordChunk = () => {
          if (!APP.micActive || !whisperStream) { ctx.close(); return; }
          let peakRMS = 0; const chunks = [];
          whisperRecorder = new MediaRecorder(whisperStream);
          whisperRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
          const meter = setInterval(() => {
            analyser.getFloatTimeDomainData(buf);
            let sum = 0;
            for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
            const rms = Math.sqrt(sum / buf.length);
            APP.micLevel = Math.min(1, rms * 5);
            peakRMS = Math.max(peakRMS, rms);
          }, 80);

          whisperRecorder.onstop = async () => {
            clearInterval(meter);
            if (peakRMS > 0.018 && !APP.isSpeakingTTS && !APP.botSpeaking && chunks.length) {
              const blob = new Blob(chunks, { type: 'audio/webm' });
              const fd = new FormData();
              fd.append('file', blob, 'speech.webm');
              fd.append('model', 'whisper-large-v3-turbo');
              fd.append('language', APP.lang.startsWith('ar') ? 'ar' : 'en');
              try {
                const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                  method: 'POST', headers: { Authorization: `Bearer ${APP.ai.keys.groq}` }, body: fd
                });
                const data = await res.json();
                if (data.text && !isPhantomTranscript(data.text)) APP.executeCommand(data.text.trim(), 'whisper');
              } catch (_) {}
            }
            if (APP.micActive) recordChunk();
          };
          whisperRecorder.start();
          setTimeout(() => { if (whisperRecorder && whisperRecorder.state === 'recording') whisperRecorder.stop(); }, 3400);
        };
        recordChunk();
        APP.ui.toast(`Groq Whisper Mic ON (${APP.lang})`);
      } catch (err) {
        APP.micActive = false; syncCoreHUD(); APP.ui.toast(`Whisper Mic Error: ${err.message}`);
      }
    }

    // =========================================================================
    // 11. CONTINUOUS SLIDER COMMAND ROUTER (0% AI <-> 100% Instructions)
    // =========================================================================
    APP.executeCommand = async function executeCommand(rawText, source = 'text') {
      const text = String(rawText || '').trim();
      if (!text) return;
      APP.ui.toast(`> "${text}"`);

      const norm = APP.normalizeText(text);
      if (norm === 'clear all' || norm === 'امسح الكل') {
        APP.clearAllEntities();
        return;
      }

      const w = APP.instWeight; // 0 = 100% AI, 100 = 100% Instructions

      // 100% Instructions Only (Offline Deterministic, Zero AI calls)
      if (w >= 100) {
        const bestAb = APP.findInstructionMatch(text);
        if (bestAb) {
          APP.ui.setStatus(`Running ${bestAb.id}...`, 'busy');
          await APP.runAbility(bestAb, text);
          APP.ui.setStatus('Ready (100% Instructions)', 'ok');
        } else {
          APP.ui.toast('100% Instructions mode: no matching @ability found. Slide toward AI for infinite creation.');
        }
        return;
      }

      // 70% - 99% Instructions-Heavy: Execute exact matching instruction immediately;
      // if no static instruction matches, fall back to AI guided heavily by instructions!
      if (w >= 70) {
        const bestAb = APP.findInstructionMatch(text);
        if (bestAb) {
          APP.ui.setStatus(`Running ${bestAb.id} (${w}% Inst)...`, 'busy');
          await APP.runAbility(bestAb, text);
          APP.ui.setStatus('Ready', 'ok');
          return;
        }
      }

      // 1% - 69% Balanced / AI-Heavy: Utility instructions run fast; creative requests go to AI with blend weight
      if (w > 0) {
        const isDirectUtility = /^(make.*pen|give.*pen|drawing gravity|toggle drawing gravity|جاذبية الرسم|spawn |احضر |جيبلي |open portal|show.*portal|افتح بوابة|اظهر بوابة)/i.test(norm);
        if (isDirectUtility) {
          const matched = await APP.runInstructionMatch(text);
          if (matched) return;
        }
      }

      if (!APP.ai || typeof APP.ai.runTurn !== 'function') {
        APP.ui.toast('AI module (ai_models.txt) not loaded yet.');
        return;
      }

      await APP.ai.runTurn(text, {
        ignoreInstructions: w <= 0,
        instWeight: w,
        source
      });
    };

    // =========================================================================
    // 12. POSE, PHYSICS, XR PLANE COLLISIONS & RENDER LOOP
    // =========================================================================
    APP.updateHeadPose = function updateHeadPose() {
      const activeCam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      activeCam.getWorldPosition(APP.headPos);
      activeCam.getWorldQuaternion(APP.headQuat);
      APP.headFwd.set(0, 0, -1).applyQuaternion(APP.headQuat).normalize();
    };

    function updateXRInputs(frame, refSpace) {
      if (!renderer.xr.isPresenting || !frame || !refSpace) {
        APP.hands.left.active = false;
        APP.hands.right.active = false;
        APP.hands.dhand.active = true;
        return;
      }
      APP.hands.dhand.active = false;

      for (const entry of xrControllers) {
        const slot = APP.hands[entry.getHandedness()] || APP.hands.right;
        const prevPinch = slot.pinching, prevGrip = slot.gripping, prevTrig = slot.trigger;

        if (entry.hand && entry.hand.joints && entry.hand.joints['index-finger-tip']) {
          const jWrist = entry.hand.joints['wrist'];
          const jThumb = entry.hand.joints['thumb-tip'];
          const jIndex = entry.hand.joints['index-finger-tip'];
          const jMid = entry.hand.joints['middle-finger-tip'];
          const jRing = entry.hand.joints['ring-finger-tip'];
          const jPinky = entry.hand.joints['pinky-finger-tip'];

          if (jIndex && jIndex.visible) {
            slot.active = true; slot.isHand = true;
            jIndex.getWorldPosition(slot.fingerTips.index);
            if (jThumb) jThumb.getWorldPosition(slot.fingerTips.thumb);
            if (jMid) jMid.getWorldPosition(slot.fingerTips.middle);
            if (jRing) jRing.getWorldPosition(slot.fingerTips.ring);
            if (jPinky) jPinky.getWorldPosition(slot.fingerTips.pinky);
            if (jWrist) { jWrist.getWorldPosition(slot.wristPos); jWrist.getWorldQuaternion(slot.quat); }

            slot.pinching = slot.fingerTips.index.distanceTo(slot.fingerTips.thumb) < 0.026;
            slot.trigger = slot.pinching;
            slot.pos.lerpVectors(slot.fingerTips.index, slot.fingerTips.thumb, 0.5);
            slot.rayOrigin.copy(slot.pos);
            slot.dir.set(0, 0, -1).applyQuaternion(slot.quat).normalize();
            slot.rayDir.copy(slot.dir);
            slot.gripping = slot.fingerTips.middle.distanceTo(slot.wristPos) < 0.085;
          }
        }
        if (entry.ctrl && (!slot.isHand || !slot.active)) {
          entry.ctrl.getWorldPosition(slot.pos);
          entry.ctrl.getWorldQuaternion(slot.quat);
          slot.dir.set(0, 0, -1).applyQuaternion(slot.quat).normalize();
          slot.rayOrigin.copy(slot.pos);
          slot.rayDir.copy(slot.dir);
          const src = slot.gamepad;
          if (src && src.buttons) {
            slot.trigger = !!src.buttons[0]?.pressed;
            slot.pinching = slot.trigger;
            slot.gripping = !!src.buttons[1]?.pressed;
          }
        }

        slot.justPinched = slot.pinching && !prevPinch;
        slot.justTriggered = slot.trigger && !prevTrig;
        slot.justGripped = slot.gripping && !prevGrip;

        if (slot.active && !slot.isHand) {
          slot.rayLine.visible = true;
          slot.rayLine.position.copy(slot.rayOrigin);
          slot.rayLine.quaternion.copy(slot.quat);
        } else {
          slot.rayLine.visible = false;
        }

        if (slot.active) {
          if (slot.justTriggered || slot.justPinched) tryPoke3D(slot.rayOrigin, slot.rayDir);
          if ((slot.justGripped || slot.justPinched) && !slot.heldEntity) tryGrabEntity(slot);
          if (slot.heldEntity && !slot.gripping && !slot.pinching && !slot.heldEntity.holdable) releaseFromSlot(slot);
        }
      }
    }

    function updateXRPlanes(frame, refSpace) {
      if (!frame || !frame.detectedPlanes || !refSpace) return;
      APP.planes = [];
      for (const xrPlane of frame.detectedPlanes) {
        const pose = frame.getPose(xrPlane.planeSpace, refSpace);
        if (!pose) continue;
        const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
        const pos = new THREE.Vector3().setFromMatrixPosition(m);
        const quat = new THREE.Quaternion().setFromRotationMatrix(m);
        const normal = new THREE.Vector3(0, 1, 0).applyQuaternion(quat).normalize();
        const pts = xrPlane.polygon.map(p => new THREE.Vector3(p.x, 0, p.z).applyMatrix4(m));
        const box = new THREE.Box3().setFromPoints(pts);
        box.min.y -= 0.03; box.max.y += 0.03;
        APP.planes.push({ semantic: xrPlane.semanticLabel || xrPlane.orientation || 'surface', orientation: xrPlane.orientation, pos, normal, box });
      }
      APP.xrPlanes = APP.planes;
    }

    function stepPhysics(dt) {
      for (const key of ['left', 'right', 'dhand']) {
        const slot = APP.hands[key];
        if (slot.active && slot.heldEntity) {
          const ent = slot.heldEntity;
          if (!ent.heldByBot) {
            ent.group.position.copy(slot.heldOffsetPos).applyQuaternion(slot.quat).add(slot.pos);
            ent.group.quaternion.copy(slot.quat).multiply(slot.heldOffsetQuat);
            ent.physics.vel.set(0, 0, 0);
          }
        }
      }

      for (const ent of APP.entities) {
        if (typeof ent.onUpdate === 'function') {
          try { ent.onUpdate(dt, ent); } catch (_) {}
        }
        if (ent.isHeld || ent.heldByBot || !ent.physics.enabled || !ent.physics.gravity) continue;

        ent.physics.vel.y -= 9.81 * dt;
        ent.group.position.addScaledVector(ent.physics.vel, dt);
        ent.physics.grounded = false;

        if (ent.group.position.y <= 0) {
          ent.group.position.y = 0;
          ent.physics.vel.y = Math.abs(ent.physics.vel.y) > 0.25 ? -ent.physics.vel.y * ent.physics.bounce : 0;
          ent.physics.vel.x *= ent.physics.friction;
          ent.physics.vel.z *= ent.physics.friction;
          ent.physics.grounded = true;
        }

        for (const pl of APP.planes) {
          const p = ent.group.position;
          if (pl.orientation === 'horizontal' &&
              p.x >= pl.box.min.x && p.x <= pl.box.max.x &&
              p.z >= pl.box.min.z && p.z <= pl.box.max.z &&
              p.y <= pl.pos.y + 0.02 && p.y >= pl.pos.y - 0.14 &&
              ent.physics.vel.y <= 0) {
            p.y = pl.pos.y;
            ent.physics.vel.y = Math.abs(ent.physics.vel.y) > 0.25 ? -ent.physics.vel.y * ent.physics.bounce : 0;
            ent.physics.vel.x *= ent.physics.friction;
            ent.physics.vel.z *= ent.physics.friction;
            ent.physics.grounded = true;
          }
        }
      }
    }

    let lastVisionTs = 0;
    APP.captureVisionFrame = function captureVisionFrame() {
      try {
        const w = 480, h = Math.round(480 * (canvas.height / Math.max(1, canvas.width)));
        const off = document.createElement('canvas');
        off.width = w; off.height = h;
        const ctx = off.getContext('2d');
        ctx.drawImage(canvas, 0, 0, w, h);
        const dataUrl = off.toDataURL('image/jpeg', 0.65);
        APP.latestVisionB64 = dataUrl.split(',')[1];
        return APP.latestVisionB64;
      } catch (_) { return null; }
    };

    const clock = new THREE.Clock();
    renderer.setAnimationLoop((time, frame) => {
      const dt = Math.min(clock.getDelta(), 0.05);
      APP.updateHeadPose();

      const refSpace = renderer.xr.isPresenting ? renderer.xr.getReferenceSpace() : null;
      updateXRInputs(frame, refSpace);
      updateXRPlanes(frame, refSpace);
      stepPhysics(dt);

      for (const hook of APP.frameHooks) {
        try { hook(dt, time * 0.001); } catch (_) {}
      }

      if (time - lastVisionTs > 3000) {
        lastVisionTs = time;
        APP.captureVisionFrame();
      }

      renderer.render(scene, camera);

      APP.hands.dhand.justPinched = false;
      APP.hands.dhand.justTriggered = false;
      APP.hands.dhand.justGripped = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    await APP.loadAllModules();
    APP.scanRepoAssets();
  </script>
</body>
</html>
