<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NexusXR — Modular Mixed Reality Studio</title>
  <style>
    :root {
      --bg-glass: rgba(10, 16, 26, 0.80);
      --border-glass: rgba(0, 240, 180, 0.28);
      --accent: #00f0b4;
      --accent-2: #38bdf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #05080d; color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      touch-action: none; user-select: none;
    }
    canvas#xr-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      z-index: 1;
    }
    #hud-root {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: env(safe-area-inset-top, 10px) 12px env(safe-area-inset-bottom, 12px);
    }
    #hud-root .interactive { pointer-events: auto; }
    .glass {
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    .btn {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .12s, background .15s, border-color .15s;
      display: inline-flex; align-items: center; gap: 5px;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(255,255,255,0.15); }
    .btn:active { transform: scale(0.96); }
    .btn.active {
      background: rgba(0, 240, 180, 0.22);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.danger { border-color: rgba(239,68,68,0.55); color: #fecaca; }
    .btn.warn { border-color: rgba(245,158,11,0.55); color: #fde68a; }
    input, select, textarea {
      background: rgba(0,0,0,0.45);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
    }
    input[type="range"] {
      padding: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    #top-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding: 8px 12px;
    }
    #status-pill {
      display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
      max-width: 58vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .dot.busy { background: var(--warn); animation: pulse 1s infinite; }
    .dot.err { background: var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    #log-toast {
      align-self: center;
      max-width: min(92vw, 660px);
      padding: 8px 14px;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
    }
    #log-toast.show { opacity: 1; transform: translateY(0); }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 30;
      background: rgba(0,0,0,0.68); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 14px;
      pointer-events: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: min(95vw, 780px); max-height: 88vh; overflow-y: auto;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;
    }
    .modal-header h3 { margin: 0; font-size: 16px; color: var(--accent); }
    #bottom-hud-mount { width: min(96vw, 880px); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    #core-bottom-bar { display: flex; flex-direction: column; gap: 7px; padding: 9px 11px; }
    .core-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .slider-wrap {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(0,240,180,0.28);
      border-radius: 10px; padding: 4px 10px; font-size: 11px; font-weight: 700;
    }
    .hidden { display: none !important; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.173.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.173.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="xr-canvas"></canvas>

  <div id="hud-root">
    <!-- Top Status & XR Entry Bar -->
    <div id="top-bar" class="glass interactive">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <strong style="color:var(--accent);letter-spacing:.4px;">NexusXR</strong>
        <div id="status-pill">
          <span id="status-dot" class="dot"></span>
          <span id="status-text">Initializing WebXR Core...</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <button id="btn-enter-ar" class="btn active">Enter AR</button>
        <button id="btn-enter-vr" class="btn">Enter VR</button>
        <button id="btn-open-ai" class="btn">AI & Keys</button>
        <button id="btn-open-assets" class="btn">Assets</button>
        <button id="btn-open-editor" class="btn">GitHub .txt</button>
      </div>
    </div>

    <!-- Floating Toast Feedback -->
    <div id="log-toast" class="glass"></div>

    <!-- Bottom HUD Mount -->
    <div id="bottom-hud-mount" class="interactive">
      <div id="core-bottom-bar" class="glass">
        <div class="core-row">
          <div class="slider-wrap" title="0% = 100% AI Creativity, 50% = Balanced, 100% = 100% Deterministic Instructions">
            <span style="color:#38bdf8;">AI</span>
            <input id="core-ai-slider" type="range" min="0" max="100" step="5" value="50" style="width:118px;" />
            <span style="color:#00f0b4;">Inst</span>
            <span id="core-slider-label" style="color:#e2e8f0;min-width:96px;text-align:center;">50% AI · 50% Inst</span>
          </div>
          <select id="core-lang-select" title="Voice Language" style="padding:5px 8px;font-size:12px;">
            <option value="en-US">en-US</option>
            <option value="ar-DZ">ar-DZ (العربية)</option>
          </select>
          <button id="core-mic-btn" class="btn">Mic: OFF</button>
          <button id="core-grav-btn" class="btn">Draw Gravity: OFF</button>
          <button id="core-clear-btn" class="btn danger">Clear All</button>
        </div>
        <div class="core-row">
          <input id="core-cmd-input" type="text" style="flex:1;min-width:190px;" placeholder="Type command (e.g. make water, make it rain, make a pen, portal to forest)..." />
          <button id="core-send-btn" class="btn active">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Shared Modal Containers -->
  <div id="modal-ai" class="modal-backdrop">
    <div class="modal-card glass">
      <div class="modal-header">
        <h3>AI Models & API Keys</h3>
        <button class="btn" id="btn-close-ai">Close</button>
      </div>
      <div id="modal-ai-body"></div>
    </div>
  </div>

  <div id="modal-assets" class="modal-backdrop">
    <div class="modal-card glass">
      <div class="modal-header">
        <h3>Repo & Local Assets (.glb, .png, .jpg, .mp4)</h3>
        <button class="btn" id="btn-close-assets">Close</button>
      </div>
      <div id="modal-assets-body">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <label class="btn active" style="cursor:pointer;">
            + Import Local Files
            <input id="local-asset-input" type="file" multiple accept=".glb,.gltf,.png,.jpg,.jpeg,.webp,.mp4,.webm" style="display:none;" />
          </label>
          <button class="btn" id="btn-refresh-assets">Scan Repo /assets/</button>
          <span style="font-size:12px;color:var(--muted);">Click any asset below to spawn in front of you.</span>
        </div>
        <div id="asset-tray-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <div id="modal-editor" class="modal-backdrop">
    <div class="modal-card glass">
      <div class="modal-header">
        <h3>GitHub .txt Natural-Language Editor & Sandbox</h3>
        <button class="btn" id="btn-close-editor">Close</button>
      </div>
      <div id="modal-editor-body"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { XREstimatedLight } from 'three/addons/webxr/XREstimatedLight.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    // =========================================================================
    // 1. RENDERER, SCENE, LIGHTING & REFLECTIONS
    // =========================================================================
    const canvas = document.getElementById('xr-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      preserveDrawingBuffer: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.xr.enabled = true;
    renderer.localClippingEnabled = true;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.03, 120);
    camera.position.set(0, 1.55, 0.2);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const roomEnvTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = roomEnvTexture;

    const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(128, {
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter
    });
    const cubeCamera = new THREE.CubeCamera(0.1, 30, cubeRenderTarget);
    scene.add(cubeCamera);

    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 0.85);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.35);
    dirLight.position.set(2.5, 4.5, 2.5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.near = 0.2;
    dirLight.shadow.camera.far = 16;
    dirLight.shadow.camera.left = -4;
    dirLight.shadow.camera.right = 4;
    dirLight.shadow.camera.top = 4;
    dirLight.shadow.camera.bottom = -4;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    let xrEstimatedLight = null;
    try {
      xrEstimatedLight = new XREstimatedLight(renderer);
      xrEstimatedLight.addEventListener('estimationstart', () => {
        scene.add(xrEstimatedLight);
        hemiLight.intensity = 0.25;
        if (xrEstimatedLight.environment) scene.environment = xrEstimatedLight.environment;
      });
      xrEstimatedLight.addEventListener('estimationend', () => {
        scene.remove(xrEstimatedLight);
        hemiLight.intensity = 0.85;
        scene.environment = roomEnvTexture;
      });
    } catch (_) {}

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.173.0/examples/jsm/libs/draco/');
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    // =========================================================================
    // 2. EVENT BUS & SHARED GLOBAL NAMESPACE: window.APP
    // =========================================================================
    const eventListeners = new Map();
    const savedWeightRaw = localStorage.getItem('APP_INST_WEIGHT');
    const initialWeight = savedWeightRaw !== null ? Math.max(0, Math.min(100, Number(savedWeightRaw))) : 50;

    function weightToMode(w) {
      if (w <= 0) return 'ai';
      if (w >= 100) return 'instructions';
      return 'ai_instructions';
    }

    const APP = window.APP = {
      THREE,
      GLTFLoader,
      DRACOLoader,
      RoundedBoxGeometry,
      gltfLoader,
      scene,
      camera,
      renderer,
      cubeCamera,
      cubeRenderTarget,
      roomEnvTexture,
      defaultEnvironmentTex: roomEnvTexture,
      ambientLight: hemiLight,
      dirLight,
      lights: { hemiLight, dirLight },

      // Continuous AI <-> Instructions Slider:
      // 0 = 100% AI Only | 50 = 50% AI / 50% Instructions | 100 = 100% Instructions Only
      instWeight: initialWeight,
      execMode: weightToMode(initialWeight),
      lang: localStorage.getItem('APP_LANG') || 'en-US',
      drawingGravity: false,
      drawingEnabled: false,
      desktopDrawActive: false,
      activeEnv: 'default',
      xrMode: 'none',
      isAR: false,
      isVR: false,
      micActive: false,
      micLevel: 0,
      isSpeakingTTS: false,
      ttsSpeaking: false,
      botSpeaking: false,

      headPos: new THREE.Vector3(0, 1.55, 0.2),
      headFwd: new THREE.Vector3(0, 0, -1),
      headQuat: new THREE.Quaternion(),

      hands: {},
      entities: [],
      planes: [],
      xrPlanes: [],
      frameHooks: new Set(),
      pokeTargets: new Set(),
      modules: {},
      abilities: new Map(),
      abilityHandlers: new Map(),
      autorunHandles: [],
      sandboxFiles: {},

      importedGLBs: new Map(),
      importedImages: new Map(),
      importedVideos: new Map(),

      ai: null,
      visual: null,
      toolbar: null,
      bot: null,
      latestVisionB64: null,

      repo: {
        owner: localStorage.getItem('GH_OWNER') || '',
        name: localStorage.getItem('GH_REPO') || '',
        branch: localStorage.getItem('GH_BRANCH') || 'main',
        pat: localStorage.getItem('GH_PAT') || ''
      },

      on(event, fn) {
        if (!eventListeners.has(event)) eventListeners.set(event, new Set());
        eventListeners.get(event).add(fn);
        return () => eventListeners.get(event)?.delete(fn);
      },
      emit(event, payload) {
        if (event === 'status') APP.ui.toast(String(payload), 3500);
        const set = eventListeners.get(event);
        if (!set) return;
        for (const fn of set) {
          try { fn(payload); } catch (e) { console.warn(`[APP.on ${event}]`, e); }
        }
      },
      onUpdate(fn) {
        APP.frameHooks.add(fn);
        return () => APP.frameHooks.delete(fn);
      },
      registerAbilityHandler(id, fn) {
        APP.abilityHandlers.set(id, fn);
      }
    };

    (function normalizeAndInferRepo() {
      const cleanSeg = (v) => String(v || '').trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/^\/+|\/+$/g, '');
      const rawOwner = cleanSeg(APP.repo.owner);
      const rawName = cleanSeg(APP.repo.name);
      if (rawOwner.includes('/')) {
        const [o, n] = rawOwner.split('/');
        APP.repo.owner = o || '';
        if (!rawName && n) APP.repo.name = n;
      } else {
        APP.repo.owner = rawOwner;
      }
      if (rawName.includes('/')) {
        const parts = rawName.split('/');
        if (!APP.repo.owner) APP.repo.owner = parts[0] || '';
        APP.repo.name = parts[1] || parts[0] || '';
      } else if (rawName) {
        APP.repo.name = rawName;
      }
      if (!APP.repo.owner && location.hostname.endsWith('.github.io')) {
        APP.repo.owner = location.hostname.split('.')[0];
        const parts = location.pathname.split('/').filter(Boolean);
        if (!APP.repo.name) {
          APP.repo.name = (parts.length > 0 && !/\.html?$/i.test(parts[0])) ? parts[0] : `${APP.repo.owner}.github.io`;
        }
      }
    })();

    APP.formatBlendLabel = function formatBlendLabel(w) {
      const inst = Math.round(w);
      const ai = 100 - inst;
      if (inst === 0) return '100% AI';
      if (inst === 100) return '100% Inst';
      return `${ai}% AI · ${inst}% Inst`;
    };

    APP.setInstWeight = function setInstWeight(val) {
      const clamped = Math.max(0, Math.min(100, Math.round(Number(val) || 0)));
      APP.instWeight = clamped;
      APP.execMode = weightToMode(clamped);
      localStorage.setItem('APP_INST_WEIGHT', String(clamped));
      localStorage.setItem('APP_EXEC_MODE', APP.execMode);
      syncCoreHUD();
      APP.emit('mode:changed', APP.execMode);
      APP.emit('instWeight:changed', clamped);
      return clamped;
    };

    APP.setExecMode = function setExecMode(mode) {
      if (mode === 'ai') return APP.setInstWeight(0);
      if (mode === 'instructions') return APP.setInstWeight(100);
      if (mode === 'ai_instructions') return APP.setInstWeight(50);
      return APP.instWeight;
    };

    APP.setLang = function setLang(lang) {
      APP.lang = lang === 'ar-DZ' ? 'ar-DZ' : 'en-US';
      localStorage.setItem('APP_LANG', APP.lang);
      syncCoreHUD();
      if (APP.micActive) {
        APP.toggleMic(false).then(() => APP.toggleMic(true));
      }
      return APP.lang;
    };

    APP.setDrawingGravity = function setDrawingGravity(val) {
      APP.drawingGravity = !!val;
      syncCoreHUD();
      APP.emit('drawing:gravity_changed', APP.drawingGravity);
      return APP.drawingGravity;
    };

    // =========================================================================
    // 3. UI STATUS, TOASTS, MODALS & CORE BOTTOM HUD
    // =========================================================================
    let toastTimer = null;
    APP.ui = {
      setStatus(text, state = 'ok') {
        const el = document.getElementById('status-text');
        const dot = document.getElementById('status-dot');
        if (el) el.textContent = text;
        if (dot) {
          dot.className = 'dot' + (state === 'busy' ? ' busy' : state === 'err' ? ' err' : '');
        }
      },
      toast(msg, duration = 4200) {
        const el = document.getElementById('log-toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), duration);
        console.log('[NexusXR]', msg);
      },
      openModal(id) {
        APP.ui.closeModals();
        const m = document.getElementById(id);
        if (m) m.classList.add('open');
      },
      closeModals() {
        document.querySelectorAll('.modal-backdrop').forEach(el => el.classList.remove('open'));
      }
    };

    function syncCoreHUD() {
      const slider = document.getElementById('core-ai-slider');
      const label = document.getElementById('core-slider-label');
      if (slider) slider.value = String(APP.instWeight);
      if (label) label.textContent = APP.formatBlendLabel(APP.instWeight);

      const langSel = document.getElementById('core-lang-select');
      if (langSel) langSel.value = APP.lang;
      const micBtn = document.getElementById('core-mic-btn');
      if (micBtn) {
        micBtn.textContent = `Mic: ${APP.micActive ? 'ON' : 'OFF'}`;
        micBtn.classList.toggle('active', APP.micActive);
      }
      const gravBtn = document.getElementById('core-grav-btn');
      if (gravBtn) {
        gravBtn.textContent = `Draw Gravity: ${APP.drawingGravity ? 'ON' : 'OFF'}`;
        gravBtn.classList.toggle('active', APP.drawingGravity);
      }
    }

    document.getElementById('btn-open-ai').onclick = () => {
      if (APP.ai?.openPanel) APP.ai.openPanel();
      else APP.ui.openModal('modal-ai');
    };
    document.getElementById('btn-open-assets').onclick = () => {
      APP.renderAssetTray();
      APP.ui.openModal('modal-assets');
    };
    document.getElementById('btn-open-editor').onclick = () => {
      if (APP.toolbar?.openGitHubEditor) APP.toolbar.openGitHubEditor();
      else APP.ui.openModal('modal-editor');
    };
    document.getElementById('btn-close-ai').onclick = () => APP.ui.closeModals();
    document.getElementById('btn-close-assets').onclick = () => APP.ui.closeModals();
    document.getElementById('btn-close-editor').onclick = () => APP.ui.closeModals();
    document.querySelectorAll('.modal-backdrop').forEach(el => {
      el.addEventListener('click', (e) => { if (e.target === el) APP.ui.closeModals(); });
    });

    const coreSlider = document.getElementById('core-ai-slider');
    coreSlider.addEventListener('input', (e) => APP.setInstWeight(e.target.value));
    document.getElementById('core-lang-select').addEventListener('change', (e) => APP.setLang(e.target.value));
    document.getElementById('core-mic-btn').addEventListener('click', () => APP.toggleMic());
    document.getElementById('core-grav-btn').addEventListener('click', () => APP.setDrawingGravity(!APP.drawingGravity));
    document.getElementById('core-clear-btn').addEventListener('click', () => APP.clearAllEntities());

    function submitCoreInput() {
      const inp = document.getElementById('core-cmd-input');
      const val = (inp.value || '').trim();
      if (!val) return;
      inp.value = '';
      APP.executeCommand(val, 'text');
    }
    document.getElementById('core-send-btn').addEventListener('click', submitCoreInput);
    document.getElementById('core-cmd-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitCoreInput(); }
    });
    syncCoreHUD();

    // =========================================================================
    // 4. THREE.JS RESOURCE CLEANUP & ENTITY REGISTRY
    // =========================================================================
    APP.disposeObject3D = function disposeObject3D(root) {
      if (!root) return;
      root.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          for (const m of mats) {
            if (!m) continue;
            for (const key of Object.keys(m)) {
              const val = m[key];
              if (val && val.isTexture) {
                if (val.image && val.image instanceof HTMLVideoElement) {
                  try { val.image.pause(); } catch (_) {}
                }
                val.dispose();
              }
            }
            m.dispose();
          }
        }
      });
    };

    let entityCounter = 0;
    APP.registerEntity = function registerEntity(group, opts = {}) {
      const id = opts.id || `ent_${++entityCounter}`;
      const record = {
        id,
        name: opts.name || id,
        category: opts.category || 'object',
        group,
        mesh: group,
        grabbable: opts.grabbable !== false,
        holdable: !!opts.holdable,
        isPen: !!opts.isPen,
        isStroke: !!opts.isStroke,
        nibMesh: opts.nibMesh || null,
        holdOffsetPos: opts.holdOffsetPos ? opts.holdOffsetPos.clone() : new THREE.Vector3(0, 0, 0),

        heldByBot: false,
        grabbedByHand: false,

          bounce: opts.restitution ?? 0.42,
          friction: 0.92,

        onUpdate: opts.onUpdate || null,
        onGrab: opts.onGrab || null,
        onRelease: opts.onRelease || null,

      if (!opts.physics?.radius) {
        const box = new THREE.Box3().setFromObject(group);
        if (!box.isEmpty()) {

    APP.findEntity = function findEntity(query) {
      if (!query) return null;
      if (typeof query === 'object' && query.group) return query;
      const q = String(query).toLowerCase().trim();
      if (q === 'latest' || q === 'last' || q === 'it') {
        return APP.entities[APP.entities.length - 1] || null;
      }
      return (
        APP.entities.find(e => e.id.toLowerCase() === q) ||
        APP.entities.find(e => e.name.toLowerCase() === q) ||
        APP.entities.slice().reverse().find(e => e.name.toLowerCase().includes(q) || e.category.toLowerCase().includes(q)) ||
        null
      );
    };

    APP.removeEntity = function removeEntity(entityOrId, withDissolve = true) {
      const ent = APP.findEntity(entityOrId);
      if (!ent) return false;
      const idx = APP.entities.indexOf(ent);
      if (idx !== -1) APP.entities.splice(idx, 1);

      if (ent.heldBy && ent.heldBy.heldEntity === ent) ent.heldBy.heldEntity = null;
      if (APP.bot && APP.bot.heldEntity === ent) APP.bot.heldEntity = null;

      const cleanup = () => {
        if (ent.group.parent) ent.group.parent.remove(ent.group);
        APP.disposeObject3D(ent.group);
      };

      if (withDissolve && APP.visual && typeof APP.visual.dissolveAndRemove === 'function') {

      } else if (withDissolve && typeof APP.dissolveObject === 'function') {

      } else {
        cleanup();

    APP.clearAllEntities = function clearAllEntities() {

    // =========================================================================
    // 5. SAFE PROCEDURAL BUILDER (APP.craft & APP.createProcedural)
    // =========================================================================
    APP.craft = {
      mat(color = 0x38bdf8, opts = {}) {
        return new THREE.MeshStandardMaterial({
          color,
          roughness: opts.roughness ?? 0.38,
          metalness: opts.metalness ?? 0.25,
          emissive: opts.emissive ?? 0x000000,
          emissiveIntensity: opts.emissiveIntensity ?? 1.0,
          transparent: !!opts.transparent,
          opacity: opts.opacity ?? 1.0,
          side: opts.doubleSided ? THREE.DoubleSide : THREE.FrontSide
        });
      },
      organicSphere(radius = 0.2, detail = 24, noiseAmp = 0.12, seed = 1) {
        const geo = new THREE.SphereGeometry(radius, detail, detail);
        const pos = geo.attributes.position;
        const v = new THREE.Vector3();
        const fn = typeof noiseAmp === 'function' ? noiseAmp : null;
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);
          if (fn) {
            const mult = fn(v.x, v.y, v.z);
            if (typeof mult === 'number' && isFinite(mult)) v.multiplyScalar(mult);
          } else {
            const n = Math.sin(v.x * 9.1 + seed) * Math.cos(v.y * 7.3 - seed) * Math.sin(v.z * 8.4 + seed);
            v.multiplyScalar(1 + n * noiseAmp);
          }
          pos.setXYZ(i, v.x, v.y, v.z);
        }
        geo.computeVertexNormals();
        return geo;
      },
      lathe(points2D, segments = 24) {
        const pts = points2D.map(p => Array.isArray(p) ? new THREE.Vector2(p[0], p[1]) : p);
        return new THREE.LatheGeometry(pts, segments);
      },
      tube(points3D, radius = 0.02, tubularSegments = 24, radialSegments = 10, closed = false) {
        const curve = new THREE.CatmullRomCurve3(points3D.map(p => p.isVector3 ? p : new THREE.Vector3(p[0], p[1], p[2])));
        return new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, closed);
      },
      bevelBox(w = 0.2, h = 0.2, d = 0.2, r = 0.02, segs = 3) {
        return new RoundedBoxGeometry(w, h, d, segs, r);
      }
    };

    APP.getSpawnPosition = function getSpawnPosition(dist = 1.15, groundY = true) {
      APP.updateHeadPose();
      const fwdFlat = new THREE.Vector3(APP.headFwd.x, 0, APP.headFwd.z);
      if (fwdFlat.lengthSq() < 0.001) fwdFlat.set(0, 0, -1);
      fwdFlat.normalize();
      const pos = APP.headPos.clone().addScaledVector(fwdFlat, dist);
      pos.y = groundY ? 0 : Math.max(0.2, APP.headPos.y - 0.18);
      return pos;
    };

    APP.createProcedural = function createProcedural(codeString, opts = {}) {
      const group = new THREE.Group();
      const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
      try {
        const cleanCode = String(codeString || '').trim()
          .replace(/^```(?:javascript|js)?/i, '')
          .replace(/```$/i, '')
          .trim();

        const fn = new Function('APP', 'group', 'THREE', 'V3', cleanCode);
        const ret = fn(APP, group, THREE, V3);
        if (ret && ret.isObject3D && ret !== group) group.add(ret);

        let meshCount = 0;
        group.traverse((c) => {
          if ((c.isMesh || c.isLine || c.isPoints || c.isSprite) && c.geometry) {
            const posAttr = c.geometry.attributes?.position;
            if (posAttr && posAttr.count > 0) meshCount++;
          }
        });

        if (meshCount === 0) {
          APP.disposeObject3D(group);
          return { ok: false, error: 'Code executed but added 0 meshes with geometry to group.' };
        }

        group.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(group);
        if (!box.isEmpty()) {
          const size = new THREE.Vector3();
          box.getSize(size);
          const maxDim = Math.max(size.x, size.y, size.z);
          if (!opts.preserveScale && maxDim > 2.8) group.scale.multiplyScalar(1.1 / maxDim);
          else if (!opts.preserveScale && maxDim < 0.02 && maxDim > 0) group.scale.multiplyScalar(0.25 / maxDim);

          group.updateMatrixWorld(true);
          const box2 = new THREE.Box3().setFromObject(group);
          if (!opts.skipGround) {
            const shiftY = -box2.min.y;
            group.children.forEach(ch => { ch.position.y += shiftY; });
          }
        }

        if (opts.position) group.position.copy(opts.position);
        else if (group.position.lengthSq() < 0.0001) group.position.copy(APP.getSpawnPosition(opts.distance || 1.1, !opts.floating));

        const userOnUpdate = typeof group.userData.onUpdate === 'function' ? group.userData.onUpdate : null;
        const wrappedUpdate = userOnUpdate
          ? (dt, ent) => userOnUpdate(dt, performance.now() * 0.001, ent)
          : null;

        const entity = APP.registerEntity(group, {
          name: opts.name || 'procedural_object',
          category: opts.category || 'procedural',
          grabbable: opts.grabbable !== false,
          holdable: !!opts.holdable,
          isPen: !!opts.isPen,
          physics: { gravity: opts.gravity ?? false, enabled: opts.physics !== false },
          onUpdate: wrappedUpdate
        });

        if (APP.visual?.applyDissolveShader) APP.visual.applyDissolveShader(group, 'materialize');
        else if (typeof APP.materializeObject === 'function') APP.materializeObject(group);

        APP.emit('entity:created', entity);
        if (opts.showcase !== false && APP.bot?.onEntityCreated) APP.bot.onEntityCreated(entity);
        return { ok: true, entity };
      } catch (err) {
        APP.disposeObject3D(group);
        return { ok: false, error: `${err.name}: ${err.message}` };
      }
    };

    // =========================================================================
    // 6. UNIFIED HAND TRACKING, CONTROLLERS & MOBILE/DESKTOP POINTER

    function createHandSlot(id, isController = false, isHand = false) {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -3)
      ]);
      const mat = new THREE.LineBasicMaterial({ color: 0x00f0b4, transparent: true, opacity: 0.45 });
      const rayLine = new THREE.Line(geo, mat);
      rayLine.visible = false;
      scene.add(rayLine);

      const slot = {
        id, active: false, isController, isHand,
        pos: new THREE.Vector3(), quat: new THREE.Quaternion(), dir: new THREE.Vector3(0, 0, -1),
        wristPos: new THREE.Vector3(),
        fingerTips: {
          thumb: new THREE.Vector3(), index: new THREE.Vector3(), middle: new THREE.Vector3(),
          ring: new THREE.Vector3(), pinky: new THREE.Vector3()
        },
        pinching: false, justPinched: false,
        gripping: false, justGripped: false,
        trigger: false, justTriggered: false,
        heldEntity: null, heldOffsetPos: new THREE.Vector3(), heldOffsetQuat: new THREE.Quaternion(),
        rayOrigin: new THREE.Vector3(), rayDir: new THREE.Vector3(0, 0, -1),
        rayLine, xrController: null, xrHand: null, gamepad: null,
        get indexTip() { return slot.isHand ? slot.fingerTips.index : slot.pos; },
        get wrist() { return slot.wristPos; },
        get selecting() { return slot.trigger; },
        get justSelected() { return slot.justTriggered; },
        get squeezing() { return slot.gripping; }
      };
      return slot;
    }

    APP.hands.left = createHandSlot('left', true, false);
    APP.hands.right = createHandSlot('right', true, false);
    APP.hands.dhand = createHandSlot('dhand', false, false);

    const controllerModelFactory = new XRControllerModelFactory();
    const handModelFactory = new XRHandModelFactory();

    const xrControllers = [0, 1].map((idx) => {
      const ctrl = renderer.xr.getController(idx);
      const grip = renderer.xr.getControllerGrip(idx);
      grip.add(controllerModelFactory.createControllerModel(grip));
      scene.add(ctrl);
      scene.add(grip);

      const hand = renderer.xr.getHand(idx);
      hand.add(handModelFactory.createHandModel(hand, 'mesh'));
      scene.add(hand);

      let handedness = idx === 0 ? 'left' : 'right';
      ctrl.addEventListener('connected', (e) => {
        handedness = e.data.handedness || handedness;
        const slot = APP.hands[handedness] || APP.hands.right;
        slot.xrController = ctrl;
        slot.xrHand = hand;
        slot.isController = !e.data.hand;
        slot.isHand = !!e.data.hand;
        slot.gamepad = e.data.gamepad || null;
        slot.active = true;
      });
      ctrl.addEventListener('disconnected', () => {
        const slot = APP.hands[handedness];
        if (slot) slot.active = false;
      });
      return { ctrl, grip, hand, getHandedness: () => handedness };
    });

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let pointerDown = false;
    let pointerMode = 'none';
    let lastPointerX = 0, lastPointerY = 0;
    let camYaw = 0, camPitch = -0.05;
    let grabDistance = 1.1;

    function updatePointerRay(clientX, clientY) {
      pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      const d = APP.hands.dhand;
      d.active = APP.xrMode === 'none';
      d.rayOrigin.copy(raycaster.ray.origin);
      d.rayDir.copy(raycaster.ray.direction);
      d.pos.copy(raycaster.ray.origin).addScaledVector(raycaster.ray.direction, grabDistance);
      d.dir.copy(raycaster.ray.direction);
      d.quat.copy(camera.quaternion);
    }

    function tryPoke3D(origin, dir) {
      if (APP.pokeTargets.size === 0) return false;
      raycaster.set(origin, dir);
      const targets = Array.from(APP.pokeTargets);
      const hits = raycaster.intersectObjects(targets, true);
      if (hits.length > 0 && hits[0].distance < 5) {
        let cur = hits[0].object;
        while (cur) {
          if (typeof cur.userData?.onPoke === 'function') {
            cur.userData.onPoke(hits[0]);
            return true;
          }
          cur = cur.parent;
        }
      }
      return false;
    }

    function grabWithSlot(slot, entity) {
      if (!entity || !entity.grabbable) return;
      if (entity.heldBy && entity.heldBy !== slot) releaseFromSlot(entity.heldBy);
      slot.heldEntity = entity;
      entity.isHeld = true;
      entity.grabbedByHand = true;
      entity.heldBy = slot;
      entity.attachedHandKey = slot.id;

      if (entity.holdable) {
        slot.heldOffsetPos.copy(entity.holdOffsetPos);
        slot.heldOffsetQuat.copy(entity.holdOffsetQuat);
      } else {
        const invQ = slot.quat.clone().invert();
        slot.heldOffsetPos.copy(entity.group.position).sub(slot.pos).applyQuaternion(invQ);
        slot.heldOffsetQuat.copy(invQ).multiply(entity.group.quaternion);
      }
      if (typeof entity.onGrab === 'function') entity.onGrab(slot);
    }

    function releaseFromSlot(slot) {
      const ent = slot.heldEntity;
      if (!ent) return;
      slot.heldEntity = null;
      ent.isHeld = false;
      ent.grabbedByHand = false;
      ent.heldBy = null;
      ent.attachedHandKey = null;
      if (typeof ent.onRelease === 'function') ent.onRelease(slot);
    }

    APP.grabEntity = grabWithSlot;
    APP.releaseEntity = releaseFromSlot;
    APP.attachToActiveHand = function attachToActiveHand(entity, opts = {}) {
      if (!entity) return null;
      if (opts.localPosition) entity.holdOffsetPos.copy(opts.localPosition);
      if (opts.localEuler) entity.holdOffsetQuat.setFromEuler(opts.localEuler);
      else if (opts.localQuat) entity.holdOffsetQuat.copy(opts.localQuat);

      const slot = (APP.hands.right.active ? APP.hands.right : null) ||
        (APP.hands.left.active ? APP.hands.left : null) || APP.hands.dhand;

      slot.active = true;
      if (slot.id === 'dhand') {
        grabDistance = 0.58;
        if (entity.isPen) APP.desktopDrawActive = true;
      }
      grabWithSlot(slot, entity);
      return slot;
    };

    function tryGrabEntity(slot) {
      let best = null, bestDist = 0.28;
      for (const ent of APP.entities) {
        if (!ent.grabbable) continue;
        const p = new THREE.Vector3();
        ent.group.getWorldPosition(p);
        const d = p.distanceTo(slot.pos);
        if (d < bestDist) { bestDist = d; best = ent; }
      }
      if (!best && APP.entities.length > 0) {
        raycaster.set(slot.rayOrigin, slot.rayDir);
        const meshes = APP.entities.filter(e => e.grabbable).map(e => e.group);
        const hits = raycaster.intersectObjects(meshes, true);
        if (hits.length > 0 && hits[0].distance < 6.0) {
          let cur = hits[0].object;
          while (cur && !cur.userData.entity) cur = cur.parent;
          if (cur?.userData?.entity) {
            best = cur.userData.entity;
            if (slot.id === 'dhand') grabDistance = Math.max(0.45, Math.min(3.5, hits[0].distance));
          }
        }
      }
      if (best) { grabWithSlot(slot, best); return true; }
      return false;
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (APP.xrMode !== 'none') return;
      pointerDown = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      updatePointerRay(e.clientX, e.clientY);
      const d = APP.hands.dhand;
      d.trigger = true; d.justTriggered = true;
      d.pinching = true; d.justPinched = true;

      if (tryPoke3D(d.rayOrigin, d.rayDir)) { pointerMode = 'poke'; return; }
      if (d.heldEntity?.isPen && (e.shiftKey || APP.desktopDrawActive)) { pointerMode = 'draw'; return; }
      if (!d.heldEntity && tryGrabEntity(d)) { pointerMode = 'grab'; return; }
      pointerMode = 'look';
    });

    window.addEventListener('pointermove', (e) => {
      if (APP.xrMode !== 'none') return;
      updatePointerRay(e.clientX, e.clientY);
      if (!pointerDown) return;
      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;

      if (pointerMode === 'look') {
        camYaw -= dx * 0.0042;
        camPitch = Math.max(-1.35, Math.min(1.35, camPitch - dy * 0.0042));
        camera.rotation.order = 'YXZ';
        camera.rotation.y = camYaw;
        camera.rotation.x = camPitch;
      }
    });

    window.addEventListener('pointerup', () => {
      if (APP.xrMode !== 'none') return;
      pointerDown = false;
      const d = APP.hands.dhand;
      d.trigger = false; d.pinching = false;
      if (pointerMode === 'grab' && d.heldEntity && !d.heldEntity.holdable) releaseFromSlot(d);
      pointerMode = 'none';
    });

    canvas.addEventListener('wheel', (e) => {
      if (APP.xrMode !== 'none') return;
      if (APP.hands.dhand.heldEntity) grabDistance = Math.max(0.35, Math.min(4.0, grabDistance - e.deltaY * 0.001));
      else {
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        camera.position.addScaledVector(fwd, -e.deltaY * 0.002);
      }
    }, { passive: true });

    // =========================================================================
    // 7. WEBXR SESSION MANAGEMENT (Quest AR Passthrough + VR Fallback)
    // =========================================================================
    async function startXR(mode) {
      if (!navigator.xr) {
        APP.ui.toast('WebXR not available in this browser — using Desktop/Mobile 3D mode.');
        return;
      }
      try {
        const sessionMode = mode === 'ar' ? 'immersive-ar' : 'immersive-vr';
        const supported = await navigator.xr.isSessionSupported(sessionMode);
        if (!supported) { APP.ui.toast(`${sessionMode} is not supported on this device.`); return; }
        const sessionInit = mode === 'ar'
          ? { requiredFeatures: ['local-floor'], optionalFeatures: ['hand-tracking', 'plane-detection', 'light-estimation', 'hit-test', 'bounded-floor'] }
          : { requiredFeatures: ['local-floor'], optionalFeatures: ['hand-tracking', 'bounded-floor'] };

        const session = await navigator.xr.requestSession(sessionMode, sessionInit);
        session.addEventListener('end', () => {
          APP.xrMode = 'none'; APP.isAR = false; APP.isVR = false;
          renderer.setClearAlpha(1);
          if (APP.visual?.onXRModeChange) APP.visual.onXRModeChange('none');
          APP.emit('xr:end');
          APP.ui.setStatus('Browser 3D Mode', 'ok');
        });
        await renderer.xr.setSession(session);
        APP.xrMode = mode; APP.isAR = mode === 'ar'; APP.isVR = mode === 'vr';
        renderer.setClearAlpha(mode === 'ar' ? 0 : 1);
        if (APP.visual?.onXRModeChange) APP.visual.onXRModeChange(mode);
        APP.emit('xr:start', { mode, session });
        APP.ui.setStatus(mode === 'ar' ? 'AR Passthrough Active' : 'VR Immersive Active', 'ok');
      } catch (err) {
        APP.ui.toast(`XR Launch Error: ${err.message}`);
      }
    }

    document.getElementById('btn-enter-ar').onclick = () => startXR('ar');
    document.getElementById('btn-enter-vr').onclick = () => startXR('vr');

    // =========================================================================
    // 8. .TXT MODULE PARSER, REPO SYNC & STRICT PRIORITY LOADER
    // =========================================================================
    APP.parseModuleText = function parseModuleText(filename, rawText) {
      const lines = rawText.replace(/\r\n/g, '\n').split('\n');
      const abilities = [];
      let current = null;
      let inCode = false;
      let codeBuf = [];

      const flush = () => {
        if (current) {
          current.code = codeBuf.join('\n').trim();
          if (current.code) abilities.push(current);
        }
        current = null; codeBuf = []; inCode = false;
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();

        if (!inCode) {
          if (!trimmed || trimmed.startsWith('#')) continue;
          if (trimmed.startsWith('@ability:')) {
            flush();
            current = {
              id: trimmed.slice(9).trim(), file: filename, autorun: false, pin: false,
              pinLabel: '', label: '', desc: '', matchRaw: '', match: [], samplePhrase: '', code: ''
            };
          } else if (current && trimmed === '@autorun') {
            current.autorun = true;
          } else if (current && trimmed.startsWith('@pin')) {
            current.pin = true;
            current.pinLabel = trimmed.includes(':') ? trimmed.split(':').slice(1).join(':').trim() : (current.label || current.id);
          } else if (current && trimmed.startsWith('@label:')) {
            current.label = trimmed.slice(7).trim();
            if (current.pin && (!current.pinLabel || current.pinLabel === current.id)) current.pinLabel = current.label;
          } else if (current && trimmed.startsWith('@desc:')) {
            current.desc = trimmed.slice(6).trim();
          } else if (current && trimmed.startsWith('@match:')) {
            const rawMatch = trimmed.slice(7).trim();
            current.matchRaw = rawMatch;
            current.match = rawMatch.split('|').map(s => s.trim()).filter(Boolean);
            current.samplePhrase = (current.match[0] || '').replace(/&/g, ' ').replace(/\s+/g, ' ').trim();
          } else if (current && (trimmed === '@code:' || trimmed === '@do:' || trimmed.startsWith('@code:') || trimmed.startsWith('@do:'))) {
            inCode = true;
            const colonIdx = trimmed.indexOf(':');
            const after = trimmed.slice(colonIdx + 1).trim();
            if (after) codeBuf.push(after);
          }
        } else {
          if (trimmed === '@end') {
            flush();
          } else if (/^@ability:\s*\S+/.test(trimmed) && line === trimmed) {
            flush();
            i--;
          } else {
            codeBuf.push(line);
          }
        }
      }
      flush();
      return abilities;
    };

    APP.normalizeText = function normalizeText(str) {
      return String(str || '').toLowerCase()
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
        .replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
    };

    APP.matchScore = function matchScore(patterns, input) {
      if (!patterns || !patterns.length) return 0;
      const normInput = APP.normalizeText(input);
      let best = 0;
      for (const clause of patterns) {
        const terms = clause.split('&').map(t => APP.normalizeText(t)).filter(Boolean);
        if (!terms.length) continue;
        let ok = true;
        for (const t of terms) { if (!normInput.includes(t)) { ok = false; break; } }
        if (ok) {
          const score = terms.length * 10 + terms.reduce((a, b) => a + b.length, 0) * 0.1;
          if (score > best) best = score;
        }
      }
      return best;
    };

    function clearStaleInstructionCaches(validFilesSet) {
      try {
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const k = localStorage.key(i);
          if (k && k.startsWith('APP_CACHE_instruction')) {
            const fname = k.slice('APP_CACHE_'.length);
            if (!validFilesSet.has(fname) && typeof APP.sandboxFiles[fname] !== 'string') {
              localStorage.removeItem(k);
            }
          }
        }
      } catch (_) {}
    }

    APP.clearModuleCache = function clearModuleCache() {
      try {
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const k = localStorage.key(i);
          if (k && k.startsWith('APP_CACHE_')) localStorage.removeItem(k);
        }
        APP.sandboxFiles = {};
      } catch (_) {}
    };

    async function fetchTextWithCache(filename) {
      if (typeof APP.sandboxFiles[filename] === 'string') return APP.sandboxFiles[filename];

      let gotExplicit404 = false;
      let networkFailed = false;

      // 1. If PAT + Repo are configured, read live from GitHub API (zero Pages CDN lag)
      if (APP.repo.pat && APP.repo.owner && APP.repo.name) {
        try {
          const apiUrl = `https://api.github.com/repos/${encodeURIComponent(APP.repo.owner)}/${encodeURIComponent(APP.repo.name)}/contents/${encodeURIComponent(filename)}?ref=${encodeURIComponent(APP.repo.branch || 'main')}&t=${Date.now()}`;
          const res = await fetch(apiUrl, {
            cache: 'no-store',
            headers: {
              Accept: 'application/vnd.github.raw+json',
              Authorization: `Bearer ${APP.repo.pat}`
            }
          });
          if (res.ok) {
            const txt = await res.text();
            localStorage.setItem(`APP_CACHE_${filename}`, txt);
            return txt;
          }
          if (res.status === 404) {
            localStorage.removeItem(`APP_CACHE_${filename}`);
            return null;
          }
        } catch (_) { networkFailed = true; }
      }

      // 2. Try same-origin hosted file (GitHub Pages / local server)
      try {
        const res = await fetch(`./${filename}?t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          const txt = await res.text();
          localStorage.setItem(`APP_CACHE_${filename}`, txt);
          return txt;
        }
        if (res.status === 404) gotExplicit404 = true;
      } catch (_) { networkFailed = true; }

      // 3. Fallback to raw.githubusercontent.com (if newly added before GH Pages finishes deploying)
      if (APP.repo.owner && APP.repo.name) {
        try {
          const rawUrl = `https://raw.githubusercontent.com/${encodeURIComponent(APP.repo.owner)}/${encodeURIComponent(APP.repo.name)}/${encodeURIComponent(APP.repo.branch || 'main')}/${encodeURIComponent(filename)}?t=${Date.now()}`;
          const res = await fetch(rawUrl, { cache: 'no-store' });
          if (res.ok) {
            const txt = await res.text();
            localStorage.setItem(`APP_CACHE_${filename}`, txt);
            return txt;
          }
          if (res.status === 404) gotExplicit404 = true;
        } catch (_) { networkFailed = true; }
      }

      // If the server explicitly returned 404 (file deleted), clear cache and DO NOT resurrect it
      if (gotExplicit404 && !networkFailed) {
        localStorage.removeItem(`APP_CACHE_${filename}`);
        return null;
      }

      // Only use localStorage fallback when offline / network failed
      return networkFailed ? localStorage.getItem(`APP_CACHE_${filename}`) : null;
    }
    APP.fetchModuleText = fetchTextWithCache;

    async function discoverInstructionFiles() {
      const found = new Set();
      let repoScanOk = false;

      if (APP.repo.owner && APP.repo.name) {
        try {
          const headers = APP.repo.pat ? { Authorization: `Bearer ${APP.repo.pat}` } : {};
          const res = await fetch(
            `https://api.github.com/repos/${encodeURIComponent(APP.repo.owner)}/${encodeURIComponent(APP.repo.name)}/contents/?ref=${encodeURIComponent(APP.repo.branch || 'main')}&t=${Date.now()}`,
            { cache: 'no-store', headers }
          );
          if (res.ok) {
            const items = await res.json();
            if (Array.isArray(items)) {
              repoScanOk = true;
              items.forEach(it => { if (/^instruction\d+\.txt$/i.test(it.name)) found.add(it.name); });
            }
          }
        } catch (_) {}
      }

      if (repoScanOk) {
        for (const k of Object.keys(APP.sandboxFiles || {})) {
          if (/^instruction\d+\.txt$/i.test(k)) found.add(k);
        }
        clearStaleInstructionCaches(found);
      } else {
        let misses = 0;
        for (let i = 1; i <= 25; i++) {
          const name = `instruction${i}.txt`;
          if (typeof APP.sandboxFiles[name] === 'string') { found.add(name); misses = 0; continue; }
          let networkFailed = false;
          try {
            const res = await fetch(`./${name}?t=${Date.now()}`, { method: 'HEAD', cache: 'no-store' });
            if (res.ok) { found.add(name); misses = 0; continue; }
            if (res.status === 404) localStorage.removeItem(`APP_CACHE_${name}`);
          } catch (_) { networkFailed = true; }

          if (networkFailed && localStorage.getItem(`APP_CACHE_${name}`)) {
            found.add(name); misses = 0; continue;
          }
          misses++;
          if (misses >= 2 && i > 2) break;
        }
      }

      return Array.from(found).sort((a, b) => parseInt(a.match(/\d+/)?.[0] || '0', 10) - parseInt(b.match(/\d+/)?.[0] || '0', 10));
    }

    APP.runAbility = async function runAbility(abilityOrId, commandText = '') {
      const ab = typeof abilityOrId === 'string' ? APP.abilities.get(abilityOrId) : abilityOrId;
      if (!ab) return { ok: false, error: `Ability "${abilityOrId}" not found.` };
      if (APP.abilityHandlers.has(ab.id)) {
        try {
          const out = await APP.abilityHandlers.get(ab.id)(commandText, ab);
          return out && typeof out === 'object' ? out : { ok: true, result: out };
        } catch (err) {
          return { ok: false, error: err.message };
        }
      }
      try {
        const AsyncFn = Object.getPrototypeOf(async function () {}).constructor;
        const fn = new AsyncFn('APP', 'THREE', 'command', 'ability', ab.code);
        const result = await fn(APP, THREE, commandText, ab);
        return { ok: true, result };
      } catch (err) {
        console.error(`[Ability Error: ${ab.id}]`, err);
        APP.ui.toast(`Ability "${ab.id}" error: ${err.message}`, 5500);

    APP.findInstructionMatch = function findInstructionMatch(commandText) {

        const s = APP.matchScore(ab.match, commandText);

    APP.runInstructionMatch = async function runInstructionMatch(commandText) {

    async function executeModuleFile(file, raw) {
      // Remove stale abilities & handlers belonging to previous versions of this file
      for (const [id, ab] of Array.from(APP.abilities.entries())) {
        if (ab.file === file) {
          APP.abilities.delete(id);
          APP.abilityHandlers.delete(id);
        }
      }
      APP.modules[file] = raw;
      const parsed = APP.parseModuleText(file, raw);
      for (const ab of parsed) {
        APP.abilities.set(ab.id, ab);
        APP.emit('ability:registered', ab);
        if (ab.autorun) {
          const res = await APP.runAbility(ab, '');
          if (!res.ok) APP.ui.toast(`${file} (${ab.id}) error: ${res.error}`, 6500);
        }
      }
    }

    APP.reloadModuleText = async function reloadModuleText(filename, newText) {
      APP.sandboxFiles[filename] = newText;
      try { localStorage.setItem(`APP_CACHE_${filename}`, newText); } catch (_) {}
      await executeModuleFile(filename, newText);

    APP.loadAllModules = async function loadAllModules() {
      if (location.protocol === 'file:') {
        APP.ui.toast('Warning: Opened via file:// — host on GitHub Pages HTTPS or local HTTP server.', 8000);
      }
      APP.ui.setStatus('Loading core .txt modules...', 'busy');
      for (let i = 1; i <= 25; i++) {
        try { APP[`_inst${i}Cleanup`]?.(); } catch (_) {}
      }
      try { APP._botCleanup?.(); } catch (_) {}
      try { APP._toolbarCleanup?.(); } catch (_) {}
      try { APP._visualCleanup?.(); } catch (_) {}

      APP.autorunHandles.forEach(fn => { try { fn(); } catch (_) {} });
      APP.autorunHandles = [];
      APP.abilities.clear();
      APP.abilityHandlers.clear();
      APP.modules = {};

      const coreOrder = ['ai_models.txt', 'visual.txt', 'toolbar.txt', 'bot.txt'];
      for (const file of coreOrder) {
        const raw = await fetchTextWithCache(file);

      if (APP.toolbar?.refresh) APP.toolbar.refresh();
      APP.emit('modules:loaded', Object.keys(APP.modules));
      const loadedList = Object.keys(APP.modules);
      APP.ui.setStatus(`Ready (${loadedList.length}: ${loadedList.join(', ')})`, loadedList.length ? 'ok' : 'err');

    // =========================================================================
    // 9. REPO & LOCAL ASSET LOADER (.glb, .gltf, .png, .jpg, .mp4)
    // =========================================================================
    const ASSET_EXT_GLB = /\.(glb|gltf)$/i;
    const ASSET_EXT_IMG = /\.(png|jpe?g|webp)$/i;
    const ASSET_EXT_VID = /\.(mp4|webm)$/i;

    function registerAssetRecord(name, url, ext) {
      const cleanName = name.replace(/\.[^.]+$/, '').toLowerCase();
      const rec = { name, cleanName, url, ext: ext.toLowerCase() };
      if (ASSET_EXT_GLB.test(name)) APP.importedGLBs.set(cleanName, rec);
      else if (ASSET_EXT_IMG.test(name)) APP.importedImages.set(cleanName, rec);
      else if (ASSET_EXT_VID.test(name)) APP.importedVideos.set(cleanName, rec);
    }

    APP.scanRepoAssets = async function scanRepoAssets() {
      if (APP.repo.owner && APP.repo.name) {
        const headers = APP.repo.pat ? { Authorization: `Bearer ${APP.repo.pat}` } : {};
        for (const folder of ['assets', '']) {
          try {
            const path = folder ? `contents/${folder}` : 'contents';
            const res = await fetch(
              `https://api.github.com/repos/${encodeURIComponent(APP.repo.owner)}/${encodeURIComponent(APP.repo.name)}/${path}?ref=${encodeURIComponent(APP.repo.branch || 'main')}&t=${Date.now()}`,
              { cache: 'no-store', headers }
            );
            if (!res.ok) continue;
            const items = await res.json();
            if (!Array.isArray(items)) continue;
            items.forEach(it => {
              if (it.type === 'file' && (ASSET_EXT_GLB.test(it.name) || ASSET_EXT_IMG.test(it.name) || ASSET_EXT_VID.test(it.name))) {
                const url = folder ? `./${folder}/${it.name}` : `./${it.name}`;
                registerAssetRecord(it.name, url, it.name.split('.').pop());
              }
            });
          } catch (_) {}
        }
      }
      APP.renderAssetTray();
    };

    APP.renderAssetTray = function renderAssetTray() {
      const container = document.getElementById('asset-tray-list');
      if (!container) return;

        ...Array.from(APP.importedGLBs.values()).map(r => ({ ...r, kind: '3D GLB' })),

        btn.onclick = () => { APP.spawnAsset(a.cleanName); APP.ui.closeModals(); };

    document.getElementById('local-asset-input').addEventListener('change', (e) => {
